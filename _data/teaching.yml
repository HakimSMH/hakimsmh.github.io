    title: Closed-Loop Neurotechnologies graduate programme
    where: University of Lille
    text: Starting Sept. 2026. Contributor to the programme design; responsible for Brain-Computer Interface teaching.

schools:
  - "**Brain, Society and Technology Graduate Program** (2026): member of the organizing committee"
  - "**NeurotechEU Autumn School “Closed-Loop Neurotechnologies”** (2022, 2025): lecture on neurotechnology design in VR"
  - "**NeurotechEU Blended Intensive Program on BCI & Robotics**: lecture on VR/BCI and hands-on session at Boğaziçi University"
  - "**Guest lecture**, University of South Australia (2024), “BCI and immersive systems: design and evaluation”"

